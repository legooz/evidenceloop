name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - name: Install
        run: python -m pip install -c constraints.txt -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest
      - name: Evaluate deterministic scenarios
        run: evidenceloop evaluate --output evaluation-results.json
      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evaluation-${{ matrix.os }}-${{ matrix.python }}
          path: evaluation-results.json
          if-no-files-found: ignore
